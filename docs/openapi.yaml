components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token (Phase 3). Refresh token is an HttpOnly cookie.

  parameters:
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StudentID:
      name: studentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeacherID:
      name: teacherID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourseID:
      name: courseID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModuleID:
      name: moduleID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CriterionID:
      name: criterionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassID:
      name: classID
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentID:
      name: enrollmentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentID:
      name: assignmentID
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: ADMIN role required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Referenced resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Unique, capacity, state, or relationship conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@nsa.local }
        password: { type: string, format: password, example: NsaDemo@123 }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }

    ProfileRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: STU-DEMO-001 }
        full_name: { type: string, example: Demo Student }

    UserInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, example: admin@nsa.local }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, TEACHER, STUDENT] }
          example: [ADMIN]
        must_change_password: { type: boolean, example: false }
        student_profile: { $ref: "#/components/schemas/ProfileRef" }
        teacher_profile: { $ref: "#/components/schemas/ProfileRef" }

    TokenBundleResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            token_type: { type: string, example: Bearer }
            access_expires_at: { type: string, format: date-time }
            must_change_password: { type: boolean }
            user: { $ref: "#/components/schemas/UserInfo" }
        message: { type: string, example: Success }

    MessageResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          properties:
            message: { type: string, example: "Logged out" }
        message: { type: string, example: Success }

    HealthResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          additionalProperties: true
        message:
          type: string
          example: Success

    UserStatus:
      type: string
      enum: [pending, active, suspended, inactive]
    StudentStatus:
      type: string
      enum: [pending, active, suspended, completed, withdrawn]
    TeacherStatus:
      type: string
      enum: [active, inactive]
    CourseStatus:
      type: string
      enum: [draft, active, inactive, archived]
    ClassStatus:
      type: string
      enum: [planning, open, in_progress, completed, cancelled, archived]
    EnrollmentStatus:
      type: string
      enum: [enrolled, transferred, completed, withdrawn]

    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    CreateStudentRequest:
      type: object
      required: [email, temporary_password, account_status, student_code, full_name, status]
      properties:
        email: { type: string, format: email }
        temporary_password: { type: string, format: password, minLength: 8 }
        account_status: { $ref: "#/components/schemas/UserStatus" }
        student_code: { type: string, maxLength: 30 }
        full_name: { type: string, maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 30 }
        date_of_birth: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/StudentStatus" }
        enrolled_at: { type: [string, "null"], format: date }
    UpdateStudentRequest:
      type: object
      required: [email, account_status, student_code, full_name, status]
      properties:
        email: { type: string, format: email }
        account_status: { $ref: "#/components/schemas/UserStatus" }
        student_code: { type: string, maxLength: 30 }
        full_name: { type: string, maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 30 }
        date_of_birth: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/StudentStatus" }
        enrolled_at: { type: [string, "null"], format: date }
    Student:
      type: object
      required: [id, user_id, email, account_status, student_code, full_name, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        account_status: { $ref: "#/components/schemas/UserStatus" }
        student_code: { type: string }
        full_name: { type: string }
        phone: { type: [string, "null"] }
        date_of_birth: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/StudentStatus" }
        enrolled_at: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StudentResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/Student" }
        message: { type: string }
    StudentListResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [items, meta]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Student" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
        message: { type: string }

    CreateTeacherRequest:
      type: object
      required: [email, temporary_password, account_status, teacher_code, full_name, status]
      properties:
        email: { type: string, format: email }
        temporary_password: { type: string, format: password, minLength: 8 }
        account_status: { $ref: "#/components/schemas/UserStatus" }
        teacher_code: { type: string, maxLength: 30 }
        full_name: { type: string, maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 30 }
        specialization: { type: [string, "null"], maxLength: 200 }
        status: { $ref: "#/components/schemas/TeacherStatus" }
    UpdateTeacherRequest:
      type: object
      required: [email, account_status, teacher_code, full_name, status]
      properties:
        email: { type: string, format: email }
        account_status: { $ref: "#/components/schemas/UserStatus" }
        teacher_code: { type: string, maxLength: 30 }
        full_name: { type: string, maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 30 }
        specialization: { type: [string, "null"], maxLength: 200 }
        status: { $ref: "#/components/schemas/TeacherStatus" }
    Teacher:
      type: object
      required: [id, user_id, email, account_status, teacher_code, full_name, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        account_status: { $ref: "#/components/schemas/UserStatus" }
        teacher_code: { type: string }
        full_name: { type: string }
        phone: { type: [string, "null"] }
        specialization: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TeacherStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeacherResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/Teacher" }
        message: { type: string }
    TeacherListResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [items, meta]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Teacher" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
        message: { type: string }

    CourseWriteRequest:
      type: object
      required: [code, name, total_sessions, minimum_attendance_pct, status]
      properties:
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"] }
        total_sessions: { type: integer, minimum: 1 }
        minimum_attendance_pct: { type: number, minimum: 0, maximum: 100 }
        status: { $ref: "#/components/schemas/CourseStatus" }
    Course:
      type: object
      required: [id, code, name, total_sessions, minimum_attendance_pct, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        total_sessions: { type: integer }
        minimum_attendance_pct: { type: number }
        status: { $ref: "#/components/schemas/CourseStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CourseResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/Course" }
        message: { type: string }
    CourseListResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [items, meta]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Course" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
        message: { type: string }

    ModuleWriteRequest:
      type: object
      required: [code, name, sequence_no, planned_sessions]
      properties:
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 200 }
        sequence_no: { type: integer, minimum: 1 }
        planned_sessions: { type: integer, minimum: 1 }
        description: { type: [string, "null"] }
    CourseModule:
      type: object
      required: [id, course_id, code, name, sequence_no, planned_sessions, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        sequence_no: { type: integer }
        planned_sessions: { type: integer }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModuleResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/CourseModule" }
        message: { type: string }
    ModuleListResponse:
      type: object
      required: [data, message]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CourseModule" } }
        message: { type: string }

    CompetencyWriteRequest:
      type: object
      required: [code, name, sequence_no]
      properties:
        module_id: { type: [string, "null"], format: uuid }
        code: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"] }
        is_required: { type: boolean, default: true }
        sequence_no: { type: integer, minimum: 1 }
    CompetencyCriterion:
      type: object
      required: [id, course_id, code, name, is_required, sequence_no, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        module_id: { type: [string, "null"], format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        is_required: { type: boolean }
        sequence_no: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompetencyResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/CompetencyCriterion" }
        message: { type: string }
    CompetencyListResponse:
      type: object
      required: [data, message]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CompetencyCriterion" } }
        message: { type: string }

    ClassWriteRequest:
      type: object
      required: [course_id, class_code, name, start_date, end_date, maximum_students, status]
      properties:
        course_id: { type: string, format: uuid }
        class_code: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 200 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        maximum_students: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/ClassStatus" }
    Class:
      type: object
      required: [id, course_id, course_code, course_name, class_code, name, start_date, end_date, maximum_students, enrolled_students, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        course_code: { type: string }
        course_name: { type: string }
        class_code: { type: string }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        maximum_students: { type: integer }
        enrolled_students: { type: integer }
        status: { $ref: "#/components/schemas/ClassStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClassResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/Class" }
        message: { type: string }
    ClassListResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [items, meta]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Class" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
        message: { type: string }

    EnrollmentCreateRequest:
      type: object
      required: [student_id]
      properties:
        student_id: { type: string, format: uuid }
    EnrollmentUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
    Enrollment:
      type: object
      required: [id, class_id, student_id, student_code, full_name, status, enrolled_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        student_code: { type: string }
        full_name: { type: string }
        status: { $ref: "#/components/schemas/EnrollmentStatus" }
        enrolled_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EnrollmentResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/Enrollment" }
        message: { type: string }
    EnrollmentListResponse:
      type: object
      required: [data, message]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Enrollment" } }
        message: { type: string }

    AssignmentCreateRequest:
      type: object
      required: [teacher_id, assignment_role]
      properties:
        teacher_id: { type: string, format: uuid }
        assignment_role: { type: string, maxLength: 80 }
    AssignmentUpdateRequest:
      type: object
      required: [assignment_role]
      properties:
        assignment_role: { type: string, maxLength: 80 }
    TeacherAssignment:
      type: object
      required: [id, class_id, teacher_id, teacher_code, full_name, assignment_role, assigned_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        teacher_id: { type: string, format: uuid }
        teacher_code: { type: string }
        full_name: { type: string }
        assignment_role: { type: string }
        assigned_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssignmentResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/TeacherAssignment" }
        message: { type: string }
    AssignmentListResponse:
      type: object
      required: [data, message]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/TeacherAssignment" } }
        message: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: STUDENT_NOT_FOUND
            message:
              type: string
              example: Student not found
            details:
              type: array
              items:
                type: object
                additionalProperties: true
              default: []

# Default security for all business endpoints; system endpoints opt out above.
security:
  - bearerAuth: []
